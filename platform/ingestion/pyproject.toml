[project]
name = "coffee-ingestion"
version = "0.1.0"
description = "Batch ingestion pipelines for the coffee-chain data platform (video #07+)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "polars>=1.10",
  "pyarrow>=17",
  "duckdb>=1.1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35", "s3fs>=2024.9"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
coffee-ingest = "coffee_ingestion.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coffee_ingestion"]
