name: coffee_gold
version: "0.1.0"
config-version: 2
profile: coffee_gold

model-paths: ["models"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Thư mục lake chứa silver parquet (xem platform/ingestion). Override bằng biến môi trường LAKE_ROOT
  # (ví dụ s3://lake khi chạy trên MinIO). CI không có file nào, nhưng `dbt parse` không cần.
  lake_root: "../../lake-local"

models:
  coffee_gold:
    +materialized: view
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: gold

snapshots:
  coffee_gold:
    +target_schema: snapshots
