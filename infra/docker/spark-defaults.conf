spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                       org.apache.iceberg.spark.SparkCatalog
# Iceberg catalog `lake` = JDBC catalog trong Postgres (db iceberg_catalog) — Spark và Trino nhìn cùng một bảng.
spark.sql.catalog.lake.type                  jdbc
spark.sql.catalog.lake.uri                   jdbc:postgresql://postgres:5432/iceberg_catalog
spark.sql.catalog.lake.jdbc.user             coffee
spark.sql.catalog.lake.jdbc.password         coffee
spark.sql.catalog.lake.warehouse             s3a://warehouse/
spark.sql.adaptive.enabled                   true
spark.sql.shuffle.partitions                 8
