# Iceberg trên MinIO, catalog JDBC dùng chung với Spark (cùng db iceberg_catalog, cùng catalog-name `lake`).
# Đã kiểm trên Trino 460: plugin iceberg có sẵn org.postgresql_postgresql-42.7.4.jar, không cần mount thêm.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lake
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=coffee
iceberg.jdbc-catalog.connection-password=coffee
iceberg.jdbc-catalog.default-warehouse-dir=s3://warehouse/
iceberg.file-format=PARQUET
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
