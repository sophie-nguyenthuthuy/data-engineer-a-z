# Lời giải lab #22 — workflow kiểm tra Terraform, chỉ chạy khi infra/terraform/ thay đổi.
# Dùng thật: copy vào .github/workflows/ci-extra.yml trên fork của bạn.
name: CI extra — terraform

"on":
  pull_request:
    paths: ["infra/terraform/**"]
  push:
    branches: [main]
    paths: ["infra/terraform/**"]

jobs:
  terraform-check:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init (no backend — CI không được chạm vào state thật)
        run: terraform init -backend=false -input=false
      - name: validate
        run: terraform validate
